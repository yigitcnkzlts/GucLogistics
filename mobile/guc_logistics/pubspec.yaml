name: guc_logistics
description: GucLogistics enterprise logistics marketplace client
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  go_router: ^14.6.2
  flutter_riverpod: ^2.6.1
  intl: any
  equatable: ^2.0.7
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.3
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  geolocator: ^13.0.2
  connectivity_plus: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

# path_provider_android 2.3+ pulls package:jni (CMake/NDK). On this host NDK 28
# linker fails during CMake compiler tests; keep the Java MethodChannel impl.
dependency_overrides:
  path_provider_android: 2.2.17

flutter:
  uses-material-design: true
  generate: false
