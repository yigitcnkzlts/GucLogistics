spring:
  application:
    name: guc-logistics-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/guclogistics}
    username: ${DB_USER:guc}
    password: ${DB_PASSWORD:guc_secret_change_me}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

guc:
  security:
    jwt:
      issuer: guclogistics
      audience: guclogistics-api
      secret: ${JWT_SECRET:dev-only-change-me-to-a-32byte-minimum-secret!!}
      access-token-minutes: 15
      refresh-token-days: 7
      mfa-token-minutes: 5
    encryption-key: ${ENCRYPTION_KEY:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
  storage:
    local-path: ${GUC_STORAGE_PATH:./data/uploads}

logging:
  pattern:
    console: "%d{ISO8601} [%thread] %-5level %logger{36} correlationId=%X{correlationId} - %msg%n"

---
spring:
  config:
    activate:
      on-profile: prod
guc:
  security:
    jwt:
      secret: ${JWT_SECRET}
    encryption-key: ${ENCRYPTION_KEY}
server:
  forward-headers-strategy: framework
