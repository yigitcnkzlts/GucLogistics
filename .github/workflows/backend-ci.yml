name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - "docker/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "docker/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test with coverage
        working-directory: backend
        run: mvn -B verify -Dguc.integration=true

      - name: Upload JaCoCo aggregate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/guc-api/target/site/jacoco-aggregate/
          if-no-files-found: warn

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/**/target/surefire-reports/
          if-no-files-found: warn

  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: OWASP Dependency-Check
        working-directory: backend
        run: |
          mvn -B org.owasp:dependency-check-maven:10.0.4:check \
            -DfailBuildOnCVSS=9 \
            -DskipProvidedScope=true \
            -DskipRuntimeScope=false \
            -Dformat=HTML \
            -DprettyPrint=true
      - name: Upload dependency-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: backend/target/dependency-check-report.html
          if-no-files-found: warn

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compile for SpotBugs
        working-directory: backend
        run: mvn -B -DskipTests compile
      - name: SpotBugs security scan
        working-directory: backend
        run: |
          mvn -B com.github.spotbugs:spotbugs-maven-plugin:4.8.6.4:spotbugs \
            -Dspotbugs.effort=Max \
            -Dspotbugs.threshold=Low \
            -Dspotbugs.failOnError=false
      - name: Upload SpotBugs reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-reports
          path: backend/**/target/spotbugsXml.xml
          if-no-files-found: warn
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-image:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.api
          push: false
          tags: guclogistics-api:ci
          outputs: type=docker,dest=/tmp/guclogistics-api.tar
      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: guclogistics-api-image
          path: /tmp/guclogistics-api.tar
