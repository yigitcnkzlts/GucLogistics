name: Mobile CI

on:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: stable
      - name: Pub get
        working-directory: mobile/guc_logistics
        run: flutter pub get
      - name: Analyze
        working-directory: mobile/guc_logistics
        run: flutter analyze
      - name: Test
        working-directory: mobile/guc_logistics
        run: flutter test
