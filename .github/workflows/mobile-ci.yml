name: Mobile CI

on:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
      - name: Pub get
        working-directory: mobile/guc_logistics
        run: flutter pub get
      - name: Analyze
        working-directory: mobile/guc_logistics
        run: flutter analyze
      - name: Test
        working-directory: mobile/guc_logistics
        run: flutter test
      - name: Build installable demo APK
        working-directory: mobile/guc_logistics
        run: flutter build apk --debug --dart-define=USE_MOCK_DATA=true
      - name: Upload demo APK
        uses: actions/upload-artifact@v4
        with:
          name: GucLogistics-Android-demo
          path: mobile/guc_logistics/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
