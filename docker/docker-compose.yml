services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: guclogistics
      POSTGRES_USER: guc
      POSTGRES_PASSWORD: guc_secret_change_me
    ports:
      - "5432:5432"
    volumes:
      - guc_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guc -d guclogistics"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/guclogistics
      DB_USER: guc
      DB_PASSWORD: guc_secret_change_me
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: docker-dev-only-change-me-32bytes-min!!
      ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  guc_pg_data:
